name: Godot Linux Export

on:
  push:
    branches: [ main, messe2025 ]
  pull_request:
    branches: [ main ]

jobs:
  export-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Download Godot
      run: |
        wget https://downloads.tuxfamily.org/godotengine/4.2.2/Godot_v4.2.2-stable_linux.x86_64.zip
        unzip Godot_v4.2.2-stable_linux.x86_64.zip
        chmod +x Godot_v4.2.2-stable_linux.x86_64

    - name: Export project to Linux
      run: |
        mkdir -p build/linux
        ./Godot_v4.2.2-stable_linux.x86_64 --headless --export-release "Linux/X11" build/linux/game.x86_64
